[project]
name = "tts-cli-tool"
version = "0.1.0"
description = "Unified Text-to-Speech CLI supporting Kokoro-82M, Chatterbox, and Fish Speech"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22.0",
    "soundfile>=0.12.0",
    "scipy>=1.10.0",
    "kokoro-onnx>=0.6.1",
    "huggingface-hub>=0.36.2",
    "fish-audio-sdk>=1.3.0",
]

[project.optional-dependencies]
kokoro = [
    "kokoro-onnx>=0.3.0",
]
chatterbox = [
    "chatterbox-tts>=0.1.2",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
]
fish = [
    "fish-audio-sdk>=0.1.0",
]
all = [
    "kokoro-onnx>=0.3.0",
    "chatterbox-tts>=0.1.2",
    "fish-audio-sdk>=0.1.0",
    "huggingface-hub>=0.20.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project.scripts]
tts = "tts_cli.cli:main"
tts-cli = "tts_cli.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
